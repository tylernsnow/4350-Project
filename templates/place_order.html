<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order</title>
</head>
<body>
    <h1>Place Order</h1>

    <!-- Order Form -->
    <form action="{{ url_for('place_order', customer_id=customer_id) }}" method="POST">

        <label for="part_id">Select Part:</label>
	<select id="part_id" name="part_id" required>
    		{% for part in parts %}
       			<option value="{{ part['part_id'] }}">
            			{{ part['part_id'] }} - {{ part['part_name'] }} (${{ '%.2f'|format(part['price']) }})
        		</option>
    		{% endfor %}
	</select>
	<br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" required><br><br>

        <button type="submit">Place Order</button>
    </form>

    {% if message %}
        <p style="color: red;">{{ message }}</p>
    {% endif %}

    <br>
    <a href="{{ url_for('customer_menu', customer_id=customer_id) }}">Back to Customer Menu</a>
</body>
</html>
