<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        .btn {
            background-color: #4c87af;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #204f6f;
        }
    </style>
</head>
<body>
    <h1>Store {{ store_id }}</h1>
    <a href="{{ url_for('all_orders') }}" class="btn">View Orders</a>
    <a href="{{ url_for('add_part') }}" class="btn">Add Part</a>
    <a href="{{ url_for('home') }}" class="btn">Home</a>
</body>
</html>
