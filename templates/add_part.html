<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Part</title>
</head>
<body>
    <h1>Add Part</h1>
    <form action="{{ url_for('add_part') }}" method="POST">
        <label for="name">Part Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="category">Category:</label>
        <input type="text" id="category" name="category" required><br><br>

        <label for="price">Price:</label>
        <input type="text" id="price" name="price" required><br><br>

        <label for="qty">Quantity:</label>
        <input type="text" id="qty" name="qty" required><br><br>

        <label for="condition">Condition:</label>
        <input type="text" id="condition" name="condition" required><br><br>

        <label for="manufacturer">Manufacturer:</label>
        <input type="text" id="manufacturer" name="manufacturer" required><br><br>

        <button type="submit">Add Part</button>
    </form>
    <!-- Display success/error message -->
    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
</body>
</html>
