<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Part</title>
</head>
<body>
    <h1>Add New Auto Part</h1>

    {% if message %}
        <p style="color: red;">{{ message }}</p>
    {% endif %}

    <form action="{{ url_for('add_part') }}" method="POST">
        <label for="name">Part Name:</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}" required><br><br>

        <label for="category">Category:</label>
        <input type="text" id="category" name="category" value="{{ category or '' }}" required><br><br>

        <label for="price">Price:</label>
        <input type="text" id="price" name="price" value="{{ price or '' }}" required><br><br>

        <label for="quantity">Stock Quantity:</label>
        <input type="text" id="quantity" name="quantity" value="{{ quantity or '' }}" required><br><br>

        <label for="condition">Condition:</label>
        <input type="text" id="condition" name="condition" value="{{ condition or '' }}" required><br><br>

        
        <button type="submit">Add Part</button>
    </form>

    <br>
    <a href="{{ url_for('home') }}">Back Home</a>
</body>
</html>
